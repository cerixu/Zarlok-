name: Żarłok QA

on:
  push:
    branches:
      - main
      - 'phase-*'
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in *.js; do
            echo "Checking $f"
            node --check "$f"
          done
      - name: Check application version
        shell: bash
        run: |
          set -euo pipefail
          APP=$(node -p "require('fs').readFileSync('util.js','utf8').match(/APP_VERSION = '([^']+)'/)[1]")
          SW=$(node -p "require('fs').readFileSync('sw.js','utf8').match(/VERSION = 'kucharzyna-([^']+)'/)[1]")
          echo "Application version: $APP"
          echo "Service Worker version: $SW"
          test "$APP" = "$SW"
          echo "Version OK: $APP"


  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser startup smoke test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/zarlok-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage();
          const errors = [];
          page.on('console', msg => { if (msg.type() === 'error') errors.push('console: ' + msg.text()); });
          page.on('pageerror', err => errors.push('pageerror: ' + err.message + '\n' + (err.stack || '')));
          page.on('requestfailed', req => errors.push('requestfailed: ' + req.url() + ' :: ' + (req.failure()?.errorText || 'unknown')));
          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle', timeout: 30000 });
          const modules = [
            'db.js','recipes.js','ui.js','router.js','pwa.js','timers.js',
            'views-start.js','views-recipes.js','views-detail.js','views-editor.js',
            'views-cook.js','views-calc.js','shopping.js','views-import.js',
            'views-settings.js','views-guide.js','views-search.js',
            'components.js','calculator.js','calc-kit.js','backup.js','importer.js','art.js','kitchen.js','search.js','views-tools.js'
          ];
          try {
            const artSource = await page.evaluate(async () => fetch('./art.js?rawdiag=1').then(r => r.text()));
            await page.evaluate((src) => { new Function(src.replace(/export\\s+/g, '')); }, artSource);
            console.log('ART_CLASSIC_PARSE_OK');
          } catch (e) {
            errors.push('ART_CLASSIC_PARSE_FAIL: ' + e.message + '\\n' + (e.stack || ''));
          }
          for (const mod of modules) {
            try {
              await page.evaluate(async (m) => { await import('./' + m + '?diag=1'); }, mod);
              console.log('MODULE_OK ' + mod);
            } catch (e) {
              errors.push('MODULE_FAIL ' + mod + ': ' + e.message + '\\n' + (e.stack || ''));
            }
          }
          await page.waitForTimeout(2500);
          const state = await page.evaluate(() => ({
            boot: !!document.querySelector('#boot'),
            bootGone: document.querySelector('#boot')?.classList.contains('gone') ?? false,
            viewText: document.querySelector('#view')?.innerText || '',
            version: window.__kucharzyna?.ready ? 'ready' : 'not-ready'
          }));
          console.log(JSON.stringify({ state, errors }, null, 2));
          if (errors.length || !state.bootGone || state.version !== 'ready') {
            throw new Error('Browser startup failed: ' + JSON.stringify({state, errors}));
          }
          await browser.close();
          NODE
