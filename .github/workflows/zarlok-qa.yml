name: Żarłok QA

on:
  push:
    branches:
      - main
      - 'phase-*'
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in *.js; do
            echo "Checking $f"
            node --check "$f"
          done
      - name: Check application version
        shell: bash
        run: |
          set -euo pipefail
          APP=$(node -p "require('fs').readFileSync('util.js','utf8').match(/APP_VERSION = '([^']+)'/)[1]")
          SW=$(node -p "require('fs').readFileSync('sw.js','utf8').match(/VERSION = 'kucharzyna-([^']+)'/)[1]")
          echo "Application version: $APP"
          echo "Service Worker version: $SW"
          test "$APP" = "$SW"
          echo "Version OK: $APP"
