name: Żarłok QA

on:
  push:
    branches:
      - main
      - 'phase-*'
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in *.js; do
            echo "Checking $f"
            node --check "$f"
          done
      - name: Cross-parser syntax check
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save acorn@8
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import * as acorn from 'acorn';
          let failed = false;
          for (const f of fs.readdirSync('.').filter(x => x.endsWith('.js'))) {
            const src = fs.readFileSync(f, 'utf8');
            try {
              acorn.parse(src, { ecmaVersion: 'latest', sourceType: 'module' });
              console.log('ACORN_OK ' + f);
            } catch (e) {
              console.error('ACORN_FAIL ' + f + ': ' + e.message + ' line=' + e.loc?.line + ' col=' + e.loc?.column);
              failed = true;
            }
          }
          if (failed) process.exit(1);
          NODE
      - name: Check application version
        shell: bash
        run: |
          set -euo pipefail
          APP=$(node -p "require('fs').readFileSync('util.js','utf8').match(/APP_VERSION = '([^']+)'/)[1]")
          SW=$(node -p "require('fs').readFileSync('sw.js','utf8').match(/VERSION = '(?:kucharzyna|zarlok)-([^']+)'/)[1]")
          echo "Application version: $APP"
          echo "Service Worker version: $SW"
          test "$APP" = "$SW"
          echo "Version OK: $APP"

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser startup smoke test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/zarlok-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();
          const errors = [];
          page.on('console', msg => { if (msg.type() === 'error') errors.push('console: ' + msg.text()); });
          page.on('pageerror', err => errors.push('pageerror: ' + err.message + '\\n' + (err.stack || '')));
          page.on('requestfailed', req => errors.push('requestfailed: ' + req.url() + ' :: ' + (req.failure()?.errorText || 'unknown')));
          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle', timeout: 30000 });
          await page.waitForTimeout(6500);
          const state = await page.evaluate(() => ({
            boot: !!document.querySelector('#boot'),
            bootGone: document.querySelector('#boot')?.classList.contains('gone') ?? false,
            viewText: document.querySelector('#view')?.innerText || '',
            recipeCards: document.querySelectorAll('.recipe-card,.rcard').length,
            indexedDB: !!window.indexedDB,
            version: window.__kucharzyna?.ready ? 'ready' : 'not-ready'
          }));
          console.log(JSON.stringify({ state, errors }, null, 2));
          const started = !state.boot || state.bootGone;
          if (errors.length || !started || state.version !== 'ready') {
            throw new Error('Browser startup failed: ' + JSON.stringify({ state, errors }));
          }

          const routeChecks = [
            ['#/inventory', 'Magazyn'],
            ['#/history', 'Historia gotowania'],
            ['#/pro', 'Żarłok PRO'],
            ['#/calc', 'Kalkulatory'],
            ['#/import', 'Importuj recepturę'],
          ];
          for (const [hash, expected] of routeChecks) {
            await page.goto('http://127.0.0.1:4173/' + hash, { waitUntil: 'networkidle', timeout: 30000 });
            await page.waitForTimeout(350);
            const body = await page.locator('#view').innerText().catch(() => '');
            console.log('ROUTE_CHECK', hash, body.slice(0, 180).replace(/\\n/g, ' | '));
            if (!body.includes(expected)) throw new Error('Route check failed for ' + hash + ': missing "' + expected + '"');
          }

          await page.goto('http://127.0.0.1:4173/#/', { waitUntil: 'networkidle', timeout: 30000 });
          await page.waitForTimeout(250);
          const libraryState = await page.evaluate(() => ({
            count: window.__kucharek?.state?.recipes?.size || window.__kucharzyna?.state?.recipes?.size || 0,
            title: document.querySelector('#view')?.innerText || ''
          }));
          console.log('LIBRARY_CHECK', JSON.stringify(libraryState));
          if (libraryState.count < 1600) throw new Error('Recipe library is incomplete: ' + libraryState.count);
          if (!libraryState.title.includes('Żarłok')) throw new Error('Home view did not render after library load');

          // Functional smoke: Magazyn
          await page.goto('http://127.0.0.1:4173/#/inventory', { waitUntil: 'networkidle', timeout: 30000 });
          await page.getByRole('button', { name: /Dodaj produkt/i }).first().click();
          await page.waitForTimeout(200);
          if (!(await page.getByText('Nowy produkt').count())) throw new Error('Inventory editor did not open');
          const nameField = page.getByLabel('Nazwa produktu');
          await nameField.fill('QA Mąka 00');
          const qtyField = page.getByLabel('Ilość');
          await qtyField.fill('5');
          await page.getByRole('button', { name: /^Zapisz$/ }).click();
          await page.waitForTimeout(250);
          if (!(await page.getByText('QA Mąka 00').count())) throw new Error('Inventory item was not rendered after save');

          // Functional smoke: scanner opens without crashing.
          await page.getByRole('button', { name: /Skanuj kod kreskowy/i }).first().click();
          await page.waitForTimeout(350);
          const scannerText = await page.locator('body').innerText();
          if (!scannerText.includes('Skanuj') && !scannerText.includes('kod')) throw new Error('Barcode scanner UI did not open');
          const closeButtons = page.getByRole('button', { name: /Zamknij|Wróć|Anuluj/i });
          if (await closeButtons.count()) await closeButtons.first().click().catch(() => {});

          // Functional smoke: inventory persistence + core PRO tabs.
          await page.goto('http://127.0.0.1:4173/#/inventory', { waitUntil: 'networkidle', timeout: 30000 });
          await page.waitForTimeout(250);
          if (!(await page.getByText('QA Mąka 00').count())) throw new Error('Inventory item disappeared after navigation');
          const inventoryBody = await page.locator('#view').innerText();
          if (!inventoryBody.includes('Magazyn')) throw new Error('Inventory screen lost its title');

          await page.goto('http://127.0.0.1:4173/#/pro?tab=delivery', { waitUntil: 'networkidle', timeout: 30000 });
          await page.waitForTimeout(300);
          if (!(await page.locator('#view').innerText()).includes('Dostawy')) throw new Error('PRO delivery tab failed');
          await page.goto('http://127.0.0.1:4173/#/pro?tab=orders', { waitUntil: 'networkidle', timeout: 30000 });
          await page.waitForTimeout(300);
          if (!(await page.locator('#view').innerText()).includes('Zamówienia')) throw new Error('PRO orders tab failed');
          await page.goto('http://127.0.0.1:4173/#/pro?tab=analytics', { waitUntil: 'networkidle', timeout: 30000 });
          await page.waitForTimeout(300);
          if (!(await page.locator('#view').innerText()).includes('Analityka')) throw new Error('PRO analytics tab failed');
          await page.goto('http://127.0.0.1:4173/#/pro?tab=automation', { waitUntil: 'networkidle', timeout: 30000 });
          await page.waitForTimeout(300);
          if (!(await page.locator('#view').innerText()).includes('Autopilot')) throw new Error('PRO automation tab failed');

          // Functional smoke: history and PRO render after the new modules are loaded.
          for (const [hash, expected] of [['#/history', 'Historia gotowania'], ['#/pro', 'Żarłok PRO']]) {
            await page.goto('http://127.0.0.1:4173/' + hash, { waitUntil: 'networkidle', timeout: 30000 });
            await page.waitForTimeout(300);
            const body = await page.locator('#view').innerText();
            if (!body.includes(expected)) throw new Error('Functional route failed: ' + hash);
          }
          await browser.close();
          NODE
